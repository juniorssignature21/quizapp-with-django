{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Page</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}"></link>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="quiz-container">
        <form action="{% url "quiz:login_user" %}" method="post">
            {% comment %} {% csrf_token %} {% endcomment %}
            {% csrf_token %}
        <div id="results-section">
            <div class="quiz-card">
              <h2 class="question">Login</h2>
              
              
              <div class="result-stats">
                <input type="text" name="username" class="form-control">
              </div>
              
              <div class="result-stats">
                <input type="password" name="pswd" class="form-control">
              </div>
              
              <button type="submit" id="restart-button" class="button">Login</button>

            </div>
          </div>
        </form>
        
        <a href="{% url "quiz:register_user" %}" class="btn btn-primary">
          Register
        </a>

    </div>
</body>
</html>
