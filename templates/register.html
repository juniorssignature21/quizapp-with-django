{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Page</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}"></link>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="quiz-container">
      {% if messages %}
      {% for message in messages %}
      <div
        class="alert alert-primary alert-dismissible fade show"
        role="alert"
      >
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
        <strong>
          {{message}}
        </strong> Alert Content
      </div>
      
      <script>
        var alertList = document.querySelectorAll(".alert");
        alertList.forEach(function (alert) {
          new bootstrap.Alert(alert);
        });
      </script>
      
      {% endfor %}
      {% endif %}
        <form action="{% url "quiz:register_user" %}" method="post">
            {% comment %} {% csrf_token %} {% endcomment %}
            {% csrf_token %}
        <div id="results-section">
            <div class="quiz-card">
              <h2 class="question">Register</h2>
              
              
              {% comment %} <div class="result-stats">
                <input type="text" name="username" class="form-control">
              </div>
              
              <div class="result-stats">
                <input type="password" name="pswd" class="form-control">
              </div> {% endcomment %}
              {{form.as_p}}
              
              <button type="submit" id="restart-button" class="button">Register</button>
            </div>
          </div>
        </form>

    </div>
</body>
</html>
