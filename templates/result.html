{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Page</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}"></link>

</head>
<body>
    <div class="quiz-container">
        <div id="results-section">
            <div class="quiz-card">
              <h2 class="question">Quiz Complete!</h2>
              
              <div class="result-circle">
                <span class="result-percentage" id="result-percentage">
                  {{user_score}}
                </span>
              </div>
              
              <div class="result-stats">
                <p>You got <span id="correct-answers">
                  {{correct_count}}
                </span> out of <span id="total-questions-result">
                  {{len_of_questions}}
                </span> questions correct</p>
              </div>
{% comment %}               
              <div class="result-feedback" id="feedback-text">
                Keep learning and try again soon.
              </div>
              
              <button id="restart-button" class="button">Take Quiz Again</button> {% endcomment %}
            </div>
          </div>
    </div>
</body>
</html>
